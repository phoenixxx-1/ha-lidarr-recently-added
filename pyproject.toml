[project]
name = "ha-lidarr-recently-added"
version = "0.2.0"
description = "Home Assistant integration for recently added Lidarr albums and artists"
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components.lidarr_recently_added"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "BLE", "C4", "D", "E", "F", "G", "I", "LOG", "N",
  "PERF", "PIE", "PL", "PT", "RET", "RUF", "S", "SIM", "T20", "TID", "UP", "W",
]
ignore = [
  "D202", "D203", "D213",
  "E501",
  "PLR0912", "PLR0913", "PLR2004",
]

# The en dash in "Artist – Album" is deliberate.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415", "D103"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
